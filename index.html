<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건강맑음 - 식품 라벨 검사기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --primary: #0F8B4D; 
            --bg-color: #F8F9FA;
            --text-dark: #1F2937;
            --text-gray: #6B7280;
            --card-bg: #FFFFFF;
        }
        
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; height: 100vh; }
        
        .top-app-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--bg-color); position: sticky; top: 0; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--primary); }
        .logo-icon { background: #84CC16; color: white; border-radius: 6px; padding: 4px; font-size: 20px; }
        .app-bar-icons { display: flex; gap: 12px; color: var(--primary); }
        
        .main-content { flex: 1; overflow-y: auto; padding: 0 20px 80px 20px; }
        
        .page { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 스캔 화면 */
        .viewfinder-container { background: #E5E7EB; border-radius: 20px; height: 350px; position: relative; margin-top: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .viewfinder-frame { position: absolute; width: 80%; height: 80%; border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; }
        .viewfinder-corners { position: absolute; width: 85%; height: 85%; }
        .corner { position: absolute; width: 30px; height: 30px; border-color: #84CC16; border-style: solid; }
        .corner.tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 12px 0 0 0; }
        .corner.tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 12px 0 0; }
        .corner.bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 12px; }
        .corner.br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 12px 0; }
        
        .scan-text { text-align: center; margin-top: 24px; }
        .scan-text h2 { font-size: 18px; margin: 0 0 8px 0; }
        .scan-text p { font-size: 14px; color: var(--text-gray); margin: 0; }
        
        .camera-btn-wrapper { display: flex; justify-content: center; margin-top: 30px; }
        .camera-btn { width: 70px; height: 70px; background: var(--primary); border-radius: 50%; border: 4px solid #D1FAE5; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(15, 139, 77, 0.3); }
        .camera-btn span { font-size: 32px; }

        /* 분석 결과 화면 */
        .result-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .status-card { border-radius: 20px; padding: 25px 20px; text-align: center; color: white; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .status-card.safe { background: linear-gradient(145deg, #0F8B4D, #047857); }
        .status-card.warning { background: linear-gradient(145deg, #F59E0B, #D97706); }
        .status-card.danger { background: linear-gradient(145deg, #EF4444, #B91C1C); }
        
        .status-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px auto; font-size: 30px; }
        .status-title { font-size: 22px; font-weight: 700; margin: 0 0 5px 0; }
        .status-desc { font-size: 13px; opacity: 0.9; margin: 0; line-height: 1.5; }
        
        .summary-text { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--text-dark); background: #E5E7EB; padding: 12px; border-radius: 12px; }
        
        /* 주의 대상 알림 박스 (새로 추가됨) */
        .target-box { background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        
        .toggle-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; background: var(--card-bg); border: 1px solid #E5E7EB; padding: 16px; border-radius: 12px; margin-bottom: 12px; font-weight: 700; font-size: 15px; color: var(--text-dark); cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .toggle-btn span.material-symbols-outlined { transition: transform 0.2s; }
        .toggle-btn.open span.material-symbols-outlined { transform: rotate(180deg); }
        
        .detail-section { display: none; background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #E5E7EB; }
        .detail-section.open { display: block; animation: fadeIn 0.3s ease; }
        
        .info-list { padding-left: 20px; margin: 0; font-size: 14px; color: var(--text-gray); line-height: 1.6; }
        .tag-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; justify-content: flex-start; }
        .tag { background: #ECFDF5; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        /* 최근 기록 화면 */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .history-header h2 { margin: 0; font-size: 20px; }
        .history-item { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .history-item-top { display: flex; justify-content: space-between; align-items: center; }
        .history-time { font-size: 12px; color: #9CA3AF; }
        .history-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .badge-safe { background: #ECFDF5; color: #059669; }
        .badge-warning { background: #FEF3C7; color: #D97706; }
        .badge-danger { background: #FEE2E2; color: #DC2626; }
        
        .history-name { font-weight: 700; font-size: 16px; }
        .history-reason-text { font-size: 13px; color: var(--text-gray); line-height: 1.4; }

        /* 소통 게시판 */
        .board-header { margin-bottom: 20px; }
        .board-header h2 { margin: 0 0 8px 0; font-size: 20px; }
        .board-header p { margin: 0; font-size: 13px; color: var(--text-gray); line-height: 1.4; }
        
        .form-group { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .input-field { width: 100%; border: 1px solid #E5E7EB; border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 12px; outline: none; background: #F9FAFB; transition: border 0.2s; }
        .input-field:focus { border-color: var(--primary); }
        textarea.input-field { height: 100px; resize: none; }
        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
        
        .board-list-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .board-count { background: #D1FAE5; color: var(--primary); font-size: 11px; padding: 3px 8px; border-radius: 10px; }
        .board-item { border-bottom: 1px solid #F3F4F6; padding: 16px 0; }
        .board-item:last-child { border-bottom: none; }
        .board-item-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .board-author { font-weight: 600; font-size: 14px; color: var(--primary); }
        .board-date { font-size: 12px; color: #9CA3AF; }
        .board-text { font-size: 14px; color: var(--text-dark); line-height: 1.5; white-space: pre-wrap; }

        /* 하단 네비게이션 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0 20px 0; border-top: 1px solid #F3F4F6; z-index: 20; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9CA3AF; cursor: pointer; border: none; background: transparent; font-size: 11px; font-weight: 500; }
        .nav-item.active { color: var(--primary); }
        .nav-item span.material-symbols-outlined { font-size: 24px; transition: 0.2s; }
        .nav-item.active span.material-symbols-outlined { font-variation-settings: 'FILL' 1; }

        /* 로딩 오버레이 */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #E5E7EB; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="top-app-bar">
        <div class="logo-area">
            <span class="material-symbols-outlined logo-icon">eco</span>
            건강맑음
        </div>
        <div class="app-bar-icons">
            <span class="material-symbols-outlined">search</span>
            <span class="material-symbols-outlined">account_circle</span>
        </div>
    </header>

    <main class="main-content">
        <!-- 1. 스캔 페이지 -->
        <div id="page-scan" class="page active">
            <div class="viewfinder-container">
                <div class="viewfinder-corners">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                </div>
                <div class="viewfinder-frame"></div>
            </div>
            <div class="scan-text">
                <h2>식품뒷면 라벨을 촬영해주세요</h2>
                <p>영양성분표가 잘 보이도록 정면에서 찍어주세요</p>
            </div>
            
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            <div class="camera-btn-wrapper">
                <button class="camera-btn" onclick="document.getElementById('camera-input').click();">
                    <span class="material-symbols-outlined">photo_camera</span>
                </button>
            </div>
        </div>

        <!-- 2. 분석 결과 페이지 -->
        <div id="page-result" class="page">
            <div class="result-header" onclick="nav('scan')">
                <span class="material-symbols-outlined">arrow_back</span>
                분석 결과
            </div>
            <div id="result-content"></div>
        </div>

        <!-- 3. 최근 기록 페이지 -->
        <div id="page-history" class="page">
            <div class="history-header">
                <h2>Recent Scans</h2>
            </div>
            <div id="history-list"></div>
        </div>

        <!-- 4. 소통 게시판 페이지 -->
        <div id="page-board" class="page">
            <div class="board-header">
                <h2>의견 남기기</h2>
                <p>건강하고 첨가물 없는 식재료 찾기에 도움이 되셨나요? 앱을 더 좋게 만들 수 있는 소중한 의견을 들려주세요.</p>
            </div>
            
            <div class="form-group">
                <input type="text" id="board-name" class="input-field" placeholder="닉네임을 입력해주세요 (예: 건강식단러)" maxlength="10">
                <textarea id="board-content" class="input-field" placeholder="사용 중 불편한 점이나 칭찬하고 싶은 점이 있나요?" required></textarea>
                <button id="btn-submit-board" class="submit-btn">
                    <span class="material-symbols-outlined">send</span> 등록하기
                </button>
            </div>

            <div class="board-list-title">
                최근 올라온 의견 <span class="board-count" id="board-count-badge">0</span>
            </div>
            <div id="board-list"></div>
        </div>
    </main>

    <!-- 하단 네비게이션 -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-scan" onclick="nav('scan')">
            <span class="material-symbols-outlined">qr_code_scanner</span>
            Scan
        </button>
        <button class="nav-item" id="nav-history" onclick="nav('history')">
            <span class="material-symbols-outlined">history</span>
            History
        </button>
        <button class="nav-item" id="nav-board" onclick="nav('board')">
            <span class="material-symbols-outlined">forum</span>
            Board
        </button>
    </nav>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-weight: 600; color: #1F2937;">AI가 라벨을 분석 중입니다...</div>
    </div>

    <!-- Firebase 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqNMgUizVYOoZ_uM12JBcEYjfsdD2Up60",
            authDomain: "food-additives-b9a6f.firebaseapp.com",
            projectId: "food-additives-b9a6f",
            storageBucket: "food-additives-b9a6f.firebasestorage.app",
            messagingSenderId: "1091978124666",
            appId: "1:1091978124666:web:8aa031c0cc3774499a4ac3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.nav = function(targetPage) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(`page-${targetPage}`).classList.add('active');
            if(targetPage !== 'result') { document.getElementById(`nav-${targetPage}`).classList.add('active'); }
            if(targetPage === 'history') loadHistory();
            if(targetPage === 'board') loadBoard();
        };
        
        window.toggleDetail = function(id) {
            const el = document.getElementById(id);
            const btn = document.getElementById(id + '-btn');
            if(el.classList.contains('open')) {
                el.classList.remove('open');
                btn.classList.remove('open');
            } else {
                el.classList.add('open');
                btn.classList.add('open');
            }
        };

        document.getElementById('camera-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading-overlay').style.display = 'flex';

            // 카메라 사용 시 메모리 부족으로 튕기는 현상을 막기 위해 약간의 시간(100ms)을 확보합니다.
            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        // 메모리 최적화를 위해 MAX_WIDTH를 800에서 600으로 낮추었습니다.
                        const MAX_WIDTH = 600;
                        let scaleSize = 1;
                        if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        
                        try {
                            const response = await fetch('/api/generate', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: base64Image })
                            });
                            
                            if (!response.ok) throw new Error('API Error');
                            const data = await response.json();
                            
                            renderResult(data);

                            try {
                                await addDoc(collection(db, "food_scans"), {
                                    product_name: data.product_name || "알 수 없는 제품",
                                    status: data.status,
                                    reasons: data.reasons || [],
                                    timestamp: new Date().toISOString()
                                });
                            } catch (err) { console.error("기록 저장 실패", err); }
                            
                            // 분석이 완벽히 성공했을 때만 결과 화면으로 이동합니다.
                            window.nav('result');
                            
                        } catch (error) {
                            alert('분석 중 오류가 발생했습니다. 사진을 다시 찍어주세요.');
                        } finally {
                            document.getElementById('loading-overlay').style.display = 'none';
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }, 100); 
        });

        function renderResult(data) {
            const container = document.getElementById('result-content');
            
            let statusConfig = { class: 'safe', icon: 'check_circle', title: 'Safe Choice', desc: '비교적 안전한 식품입니다.', badge: 'badge-safe' };
            if (data.status === 'danger') statusConfig = { class: 'danger', icon: 'warning', title: 'Danger', desc: '주의가 필요한 식품입니다!', badge: 'badge-danger' };
            else if (data.status === 'warning') statusConfig = { class: 'warning', icon: 'error', title: 'Warning', desc: '첨가물이 일부 포함되어 있습니다.', badge: 'badge-warning' };

            const shortSummary = data.reasons && data.reasons.length > 0 ? data.reasons[0] : '특이사항 없음';

            let html = `
                <div class="status-card ${statusConfig.class}">
                    <div class="status-icon"><span class="material-symbols-outlined">${statusConfig.icon}</span></div>
                    <h2 class="status-title">${statusConfig.title}</h2>
                    <p class="status-desc">${statusConfig.desc}</p>
                </div>
                
                <h3 style="text-align:center; margin: 20px 0 10px 0; font-size: 18px;">🛒 ${data.product_name || '알 수 없는 제품'}</h3>
                
                <div class="summary-text">💡 핵심 키워드 : ${shortSummary}</div>
            `;
            
            // 토글 영역 내부에 주의 대상(Target) 내용 추가
            if (data.reasons && data.reasons.length > 0) {
                let detailHtml = '';
                
                // 해당 없음이 아닐 경우 빨간색 경고 박스로 표시
                if (data.warning_target && data.warning_target !== '해당 없음') {
                    detailHtml += `<div class="target-box">
                                      <span class="material-symbols-outlined" style="font-size: 18px;">error</span>
                                      주의 권장 대상: ${data.warning_target}
                                   </div>`;
                }
                
                detailHtml += `<ul class="info-list">`;
                data.reasons.forEach(reason => detailHtml += `<li>${reason}</li>`);
                detailHtml += `</ul>`;

                html += `
                <button class="toggle-btn" id="detail-reasons-btn" onclick="toggleDetail('detail-reasons')">
                    자세한 분석 사유 보기 <span class="material-symbols-outlined">expand_more</span>
                </button>
                <div id="detail-reasons" class="detail-section">
                    ${detailHtml}
                </div>`;
            }

            if (data.terms && data.terms.length > 0) {
                html += `
                <button class="toggle-btn" id="detail-terms-btn" onclick="toggleDetail('detail-terms')">
                    어려운 용어 해설 보기 <span class="material-symbols-outlined">expand_more</span>
                </button>
                <div id="detail-terms" class="detail-section">`;
                data.terms.forEach(term => {
                    html += `<div style="margin-bottom:12px;">
                                <div style="font-weight:600; margin-bottom:6px;">${term.name}</div>
                                <div class="tag-group">`;
                    term.hashtags.forEach(tag => { html += `<span class="tag">${tag}</span>`; });
                    html += `</div></div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<div style="text-align:center; padding:20px;">불러오는 중...</div>';
            try {
                const q = query(collection(db, "food_scans"), orderBy("timestamp", "desc"), limit(15));
                const snapshot = await getDocs(q);
                let html = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.timestamp).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                    
                    let badgeInfo = { class: 'badge-safe', icon: 'check_circle', text: 'Safe' };
                    if (data.status === 'danger') badgeInfo = { class: 'badge-danger', icon: 'warning', text: 'Danger' };
                    else if (data.status === 'warning') badgeInfo = { class: 'badge-warning', icon: 'error', text: 'Warning' };
                    
                    const shortReason = data.reasons && data.reasons.length > 0 ? data.reasons[0] : '특이사항 없음';
                    
                    html += `
                    <div class="history-item">
                        <div class="history-item-top">
                            <div class="history-time">${date}</div>
                            <div class="history-badge ${badgeInfo.class}">
                                <span class="material-symbols-outlined" style="font-size:14px;">${badgeInfo.icon}</span>
                                ${badgeInfo.text}
                            </div>
                        </div>
                        <div class="history-name">${data.product_name || '제품명 없음'}</div>
                        <div class="history-reason-text">${shortReason}</div>
                    </div>`;
                });
                list.innerHTML = html || '<div style="text-align:center;">기록이 없습니다.</div>';
            } catch (err) { list.innerHTML = '불러오기 실패'; }
        }

        async function loadBoard() {
            const list = document.getElementById('board-list');
            list.innerHTML = '<div style="text-align:center; padding:20px;">불러오는 중...</div>';
            try {
                const q = query(collection(db, "feedback_board"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                document.getElementById('board-count-badge').innerText = `${snapshot.size}개의 피드백`;
                
                let html = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const dateObj = new Date(data.timestamp);
                    const now = new Date();
                    const diffMs = now - dateObj;
                    const diffMins = Math.floor(diffMs / 60000);
                    let timeAgo = '';
                    
                    if(diffMins < 60) timeAgo = diffMins === 0 ? '방금 전' : `${diffMins}분 전`;
                    else if(diffMins < 1440) timeAgo = `${Math.floor(diffMins/60)}시간 전`;
                    else timeAgo = dateObj.toLocaleDateString();

                    html += `
                    <div class="board-item">
                        <div class="board-item-header">
                            <span class="board-author">${data.name || '익명'}</span>
                            <span class="board-date">${timeAgo}</span>
                        </div>
                        <div class="board-text">${data.content}</div>
                    </div>`;
                });
                list.innerHTML = html || '<div style="text-align:center; color:#9CA3AF;">첫 번째 의견을 남겨주세요!</div>';
            } catch (err) { list.innerHTML = '게시글 불러오기 실패'; }
        }

        document.getElementById('btn-submit-board').addEventListener('click', async () => {
            const nameInput = document.getElementById('board-name').value.trim();
            const contentInput = document.getElementById('board-content').value.trim();
            if (!contentInput) return alert("내용을 입력해주세요.");

            const btn = document.getElementById('btn-submit-board');
            btn.innerHTML = '등록 중...';
            btn.disabled = true;

            try {
                await addDoc(collection(db, "feedback_board"), {
                    name: nameInput || '익명',
                    content: contentInput,
                    timestamp: new Date().toISOString()
                });
                document.getElementById('board-name').value = '';
                document.getElementById('board-content').value = '';
                loadBoard();
            } catch (error) {
                alert("등록 중 오류가 발생했습니다.");
            } finally {
                btn.innerHTML = '<span class="material-symbols-outlined">send</span> 등록하기';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
