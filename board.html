<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소통게시판 - 건강한 식재료 라벨 검사기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; text-align: center; background-color: #f4f7f6; color: #333; margin: 0; }
        h1 { font-size: 24px; color: #2c3e50; }
        
        /* 상단 뒤로가기 버튼 */
        .top-nav { text-align: left; margin-bottom: 20px; }
        .back-btn { padding: 8px 15px; background-color: #95a5a6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
        
        /* 입력 폼 스타일 */
        .form-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: left; }
        .input-name { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .input-content { width: 100%; padding: 10px; height: 100px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: none; }
        .submit-btn { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* 게시글 목록 스타일 */
        #board-list { text-align: left; }
        .board-item { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .board-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #7f8c8d; }
        .board-name { font-weight: bold; color: #2c3e50; font-size: 14px; }
        .board-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="back-btn">⬅️ 메인으로 돌아가기</a>
    </div>

    <h1>💬 사용자의 의견을 들려주세요</h1>
    <p>앱 사용 후기나 개선할 점을 편하게 남겨주세요.</p>

    <!-- 의견 작성 폼 -->
    <div class="form-container">
        <input type="text" id="user-name" class="input-name" placeholder="닉네임 (예: 건강식단러)" maxlength="10">
        <textarea id="user-content" class="input-content" placeholder="건강한 식재료를 찾는데 도움이 되셨나요? 의견을 자유롭게 남겨주세요!" required></textarea>
        <button id="submit-btn" class="submit-btn">의견 등록하기</button>
    </div>

    <!-- 의견 목록 표시 영역 -->
    <div id="board-list">
        <!-- 자바스크립트를 통해 데이터가 여기에 표시됩니다 -->
    </div>

    <!-- Firebase 모듈 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // 기존과 동일한 파이어베이스 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyAqNMgUizVYOoZ_uM12JBcEYjfsdD2Up60",
            authDomain: "food-additives-b9a6f.firebaseapp.com",
            projectId: "food-additives-b9a6f",
            storageBucket: "food-additives-b9a6f.firebasestorage.app",
            messagingSenderId: "1091978124666",
            appId: "1:1091978124666:web:8aa031c0cc3774499a4ac3",
            measurementId: "G-4WH2DQDF4X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 페이지 로드 시 게시글 불러오기
        async function loadBoard() {
            const boardList = document.getElementById('board-list');
            boardList.innerHTML = '<p style="text-align:center; color:#7f8c8d;">게시글을 불러오는 중입니다... ⏳</p>';
            
            try {
                // feedback_board 컬렉션에서 시간 역순으로 데이터 가져오기
                const q = query(collection(db, "feedback_board"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                let html = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.timestamp).toLocaleString();
                    
                    html += `
                    <div class="board-item">
                        <div class="board-header">
                            <span class="board-name">${data.name || '익명'}</span>
                            <span>${date}</span>
                        </div>
                        <div class="board-content">${data.content}</div>
                    </div>`;
                });
                
                boardList.innerHTML = html || '<p style="text-align:center; color:#7f8c8d;">등록된 의견이 없습니다. 첫 번째 의견을 남겨주세요!</p>';
            } catch (error) {
                console.error("게시글 불러오기 에러:", error);
                boardList.innerHTML = '<p style="text-align:center; color:#e74c3c;">게시글을 불러오는데 실패했습니다.</p>';
            }
        }

        // 등록 버튼 클릭 이벤트
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('user-name').value.trim();
            const contentInput = document.getElementById('user-content').value.trim();

            if (!contentInput) {
                alert("내용을 입력해주세요.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "등록 중...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "feedback_board"), {
                    name: nameInput || '익명',
                    content: contentInput,
                    timestamp: new Date().toISOString()
                });
                
                alert("의견이 성공적으로 등록되었습니다!");
                document.getElementById('user-name').value = '';
                document.getElementById('user-content').value = '';
                
                // 등록 완료 후 목록 새로고침
                loadBoard();
            } catch (error) {
                console.error("등록 실패:", error);
                alert("등록 중 오류가 발생했습니다.");
            } finally {
                btn.innerText = "의견 등록하기";
                btn.disabled = false;
            }
        });

        // 초기 실행
        loadBoard();
    </script>
</body>
</html>
